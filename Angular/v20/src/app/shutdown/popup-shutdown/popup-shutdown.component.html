<div class="card my-5">
  <div class="card-body">
    @if (!stateService.getShutdownActive()) {
      <div>
        <div style="display: flex; justify-content: space-around;">
          <button class="material-icons shutdown-action" [class.pressed]="isShutdown" (click)="shutdownAction(true)">power_settings_new</button>
          <button class="material-icons shutdown-action" [class.pressed]="!isShutdown" (click)="shutdownAction(false)">dark_mode</button>
        </div>

        @if (isShutdown) {
          <mat-form-field>
            <mat-select placeholder="Éteindre dans ...">
              <cdk-virtual-scroll-viewport itemSize="50" class="menu">
                @for (choix of heures; track choix) {
                  <mat-option [value]="choix" (click)="selectionnerHeure(choix)">{{choix}}</mat-option>
                }
              </cdk-virtual-scroll-viewport>
            </mat-select>
          </mat-form-field>
        }

        @if (heureSelected != undefined || !isShutdown) {
          <button mat-raised-button type="submit" class="btn btn-info" (click)="onSubmitShutdown()">Valider</button>
        }
      </div>
    } @else {
      <div class="shutdown-text">
        <span>
          Le PC s'éteindra dans
        </span>
        <span>
          <h3>{{stateService.displayTimeLeft()}}</h3>
        </span>
        <br/>
        <button mat-raised-button type="submit" color="accent" class="btn btn-info" (click)="onSubmitCancel()">Annuler</button>
      </div>
    }
  </div>
</div>
