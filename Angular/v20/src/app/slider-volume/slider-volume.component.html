<div class="tuile_2x1 material-icons" style="background-color: lightcyan;">
    <h1>volume_up</h1>
    <mat-slider
        class="mat-slider"
        [max]="max"
        [min]="min"
        [step]="step"
        [discrete]="true">
        <input
            matSliderThumb
            [value]="currentVolume"
            (valueChange)="onChangeVolume($event)"/>
    </mat-slider>
</div>
