<div
  id="title"
  class="titre-telecommande"
  (click)="headshake()"
  (swipeleft)="onSwipeLeft()"
  (swiperight)="onSwipeRight()"
>
  <div class="icons" style="display: flex; justify-content: space-around;">
    <h1><div class="material-icons" (click)="onSwipeRight()">{{ symbolMap.get(swipeRight()) }}</div></h1>
    <h1>TELECOMMANDE v20</h1>
    <h1><div class="material-icons" (click)="onSwipeLeft()">{{ symbolMap.get(swipeLeft()) }}</div></h1>
  </div>
</div>
