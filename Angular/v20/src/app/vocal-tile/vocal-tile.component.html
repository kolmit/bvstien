<div #vocalTile class="tuile_3x1" style="background-color: lightcyan;" (click)="listen()">
  <div>
    {{keyboardInputValue}}
  </div>
  <div>
    @if (inputDisplayed) {
      <input matInput #vocalCommandInput class="vocal-input" [(ngModel)]="keyboardInputValue" (ngModelChange)="onModelChange($event)">
    }
  </div>
</div>
